name: Build iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  backend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Compile Python Backend
        run: python3 -m py_compile app.py

  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build archive
        run: |
          xcodebuild archive \
            -project YTMusicLibrary.xcodeproj \
            -scheme YTMusicLibrary \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/YTMusicLibrary.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R "$RUNNER_TEMP/YTMusicLibrary.xcarchive/Products/Applications/YTMusicLibrary.app" Payload/
          zip -r YTMusicLibrary-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: YTMusicLibrary-unsigned-ipa
          path: YTMusicLibrary-unsigned.ipa
